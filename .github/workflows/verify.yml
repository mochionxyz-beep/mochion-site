name: Verify the record

# Runs record-verify (mochionxyz-beep/record-kit) against this repo's own
# history and writes data/verify.json for <verified-tape> to render.
#
# DELIBERATELY SEPARATE from deploy.yml, and DELIBERATELY NOT on `push`: a
# verifier bug, a rate limit, or a slow network call must NEVER be able to
# stop the daily record from deploying. continue-on-error is set for an
# initial settling period (see the migration notes) — remove it once this
# has run cleanly for a couple of weeks.
on:
  schedule:
    - cron: '30 0 * * *'      # daily, after the 00:05 UTC data push + deploy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history — the append check needs every revision, not just HEAD

      - name: Run record-verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No "record-verify" after the package spec: record-kit's package.json
          # `name` field IS "record-verify", matching one of its two declared
          # bins, so npx resolves it automatically. Adding the name back in
          # makes npx treat it as a second, unrelated package to install --
          # confirmed the hard way: this exact line failed every run with
          # "fatal: repository 'record-verify.git' not found" until fixed.
          #
          # The trailing `|| true` is deliberate, not a mistake: record-verify
          # exits 1 on a genuine FAIL verdict, which this repo's own pre-
          # record.v1-adoption history triggers (old commits lack the spec
          # tag -- expected, already understood, not a new bug). Under
          # `bash -e` that non-zero exit would skip the commit step below
          # entirely -- silently failing to publish the report at exactly
          # the moment it has something to say. Publishing the verdict,
          # including a FAIL one, is the whole point of this workflow.
          npx --yes github:mochionxyz-beep/record-kit . \
            --url https://mochion.xyz/data/public.json \
            --format verify-json --out data/verify.json || true

      - name: Commit the report if it changed
        run: |
          git config user.name mochion
          git config user.email dev@mochion.xyz
          git add data/verify.json
          if ! git diff --cached --quiet; then
            git commit -q -m "verify: refresh integrity report"
            git push -q
          fi
